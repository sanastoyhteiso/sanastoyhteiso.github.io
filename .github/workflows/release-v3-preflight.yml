name: Release V3 preflight (no deployment)
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'family.js'
      - 'community.js'
      - 'sw.js'
      - 'v3-sync-*.js'
      - 'ipad-selects.js'
      - 'ipad-selects.css'
      - 'config.js'
      - 'release-checks/**'
      - '.github/workflows/release-v3-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure existing Auth/Drive remain and iPad/Mediatri scripts are safe
        run: node release-checks/preflight-static.cjs
      - name: Verify UI changes map to idempotent V3 event intents
        run: node release-checks/v3-diff.test.cjs
      - name: Install isolated browser simulation dependencies
        run: npm install --no-save jsdom@24.1.1 fake-indexeddb@6.2.7
      - name: Exercise unified UI, Google account stub and offline V3 storage
        run: node release-checks/v3-unified-browser.test.cjs
