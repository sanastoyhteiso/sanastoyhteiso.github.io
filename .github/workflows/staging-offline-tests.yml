# Staging-only tests. This workflow never connects to Firebase or Google.
name: Staging offline sync tests
on:
  pull_request:
    paths:
      - 'staging/**'
      - '.github/workflows/staging-offline-tests.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned staging test dependencies (offline demos only)
        run: npm install --prefix staging --no-audit --no-fund
      - name: Validate baseline code and catalog
        run: node staging/tests/smoke.test.js
      - name: Test offline sync, retries, account isolation and baseline
        run: node staging/tests/sync-integration.test.js
      - name: Reject unsafe progress keys and conflicting word identities
        run: node staging/tests/sync-core-security.test.cjs
      - name: Test safe paginated cloud pull on two devices
        run: node staging/tests/sync-cloud-read.test.cjs
      - name: Test guarded controller cloud preview and local change races
        run: node staging/tests/sync-controller-cloud.test.cjs
      - name: Test read-only current app storage adapter and pending ID collisions
        run: node staging/tests/sync-local-adapter.test.cjs
      - name: Test atomic IndexedDB shadow store, browser tabs and offline outbox
        run: node staging/tests/sync-shadow-idb.test.cjs
      - name: Test verified cloud read into isolated shadow without live app writes
        run: node staging/tests/sync-shadow-reconcile.test.cjs
      - name: Test read-only multilingual admin preview and permission guard
        run: node staging/tests/admin-preview.test.cjs
      - name: Test read-only Firestore permissions diagnostic
        run: node staging/tests/firestore-diagnostics.test.cjs
      - name: Check personal JSON backup preflight without private data upload
        run: node staging/tests/personal-backup-audit.test.cjs
      - name: Check browser test pages have no uploads or write operations
        run: node staging/tests/browser-pages.test.cjs
      - name: Use Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify original and proposed Firestore security rules in emulator
        timeout-minutes: 8
        run: ./staging/node_modules/.bin/firebase emulators:exec --only firestore --config staging/firebase-emulator.json --project demo-sanastoyhteiso 'node staging/tests/firestore-rules.test.cjs'
      - name: Verify minimal owner-only sync_v3 pilot rules in emulator
        timeout-minutes: 8
        env:
          FIRESTORE_RULES_FILE: staging/firestore.rules.pilot.test
          PILOT_ADMIN_DISABLED: '1'
        run: ./staging/node_modules/.bin/firebase emulators:exec --only firestore --config staging/firebase-emulator.json --project demo-sanastoyhteiso 'node staging/tests/firestore-rules.test.cjs'
